<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Bake It Pretty bakery for custom orders, questions, or feedback.">
    <title>Contact Us | Bake It Pretty</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bakery-storefront">
        <header class="storefront-header">
            <div class="awning"></div>
            <div class="logo-wrapper">
                <span class="bakery-icon">🧁</span>
                <h1>Contact Us</h1>
                <div class="tagline">✨ say hello ✨</div>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="enquiry.html">Enquiry</a></li>
                    <li><a href="contact.html" class="active">Contact Us</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <div class="treat-grid">
                <article class="treat-card"><h3>WhatsApp</h3><p>078 589 8247</p></article>
                <article class="treat-card"><h3>Email</h3><p>BakeItPretty_03@gmail.com</p></article>
            </div>

            <!-- 4.1 HTML Form with JS Validation -->
            <section class="promise" style="text-align: left;">
                <h2 style="text-align: center;">Send us a Message</h2>
                <form id="contactForm" action="mailto:BakeItPretty_03@gmail.com" method="POST" onsubmit="return validateForm(event)">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Jane Doe">

                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required placeholder="jane@example.com">

                    <label for="messageType">Type of Message:</label>
                    <select id="messageType" name="messageType">
                        <option value="general">General Question</option>
                        <option value="order">Custom Order</option>
                        <option value="feedback">Feedback</option>
                    </select>

                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Type your message here..."></textarea>

                    <!-- Error message container for JS -->
                    <p id="formError" style="color: red; font-weight: bold; display: none;"></p>

                    <button type="submit" class="order-btn" style="width: 100%; margin-top: 1rem;">Send Email</button>
                </form>
            </section>
        </main>

        <footer>
            <p>© 2025 Bake It Pretty</p>
            <ul class="footer-links"><li><a href="contact.html">Contact</a></li></ul>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
